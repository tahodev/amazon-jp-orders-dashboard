<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
  <title>Amazon JP Orders</title>
</head>
<body>
  <header>
    <h1>Amazon JP Orders</h1>
    <div id="health" class="muted">ローカル受信サービスを確認中...</div>
  </header>

  <button id="syncLatest" type="button" class="primary-action">最新の注文を同期</button>
  <div id="syncHint" class="sync-hint">ローカルの最新注文付近から今日まで自動更新します</div>
  <p class="privacy-note">注文日・商品名・金額を読み取り、このPCのローカルサービスだけに保存します。</p>

  <label>
    年
    <select id="year"></select>
  </label>

  <div class="date-grid">
    <label>
      開始日
      <input id="since" type="date">
    </label>
    <label>
      終了日
      <input id="until" type="date">
    </label>
  </div>

  <label class="check">
    <input id="details" type="checkbox" checked>
    <span>注文内容ページも確認する</span>
  </label>

  <div class="actions">
    <button id="openYear" type="button" class="ghost">選択した年の注文履歴を開く</button>
    <button id="capture" type="button">現在のページを取り込む</button>
    <button id="captureAll" type="button">指定期間を取り込む</button>
    <button id="dashboard" type="button" class="ghost">支出ダッシュボード</button>
  </div>

  <pre id="log"></pre>

  <script src="capture_core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
