<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
  <title>Amazon JP Orders</title>
</head>
<body>
  <header>
    <h1>Amazon JP Orders</h1>
    <div id="health" class="muted">checking receiver...</div>
  </header>

  <button id="syncLatest" type="button" class="primary-action">一键同步最新订单</button>
  <div id="syncHint" class="sync-hint">自动从本地最后订单附近更新到今天</div>

  <label>
    年份
    <select id="year"></select>
  </label>

  <div class="date-grid">
    <label>
      开始
      <input id="since" type="date">
    </label>
    <label>
      结束
      <input id="until" type="date">
    </label>
  </div>

  <label class="check">
    <input id="details" type="checkbox" checked>
    <span>注文内容ページも読む</span>
  </label>

  <div class="actions">
    <button id="openYear" type="button" class="ghost">打开所选年份订单</button>
    <button id="capture" type="button">抓取当前页</button>
    <button id="captureAll" type="button">按日期范围抓取</button>
    <button id="dashboard" type="button" class="ghost">Dashboard</button>
  </div>

  <pre id="log"></pre>

  <script src="capture_core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
