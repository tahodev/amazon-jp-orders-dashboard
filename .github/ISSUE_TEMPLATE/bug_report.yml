name: Bug report
description: Report a reproducible parser, sync, or dashboard problem without private data
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not upload real order IDs, names, addresses, account screenshots, cookies, or files from `data/`.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Chrome extension
        - Amazon page parsing
        - Local receiver
        - Dashboard or CSV
        - Documentation
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Use synthetic values when an example is needed.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Chrome version, Python version
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all personal order and account information.
          required: true
