name: Feature request
description: Suggest a focused improvement without sharing private order data
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したいこと / Problem
      description: Describe the workflow or limitation, not only the requested implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案 / Proposed behavior
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Chrome extension
        - Amazon page parsing
        - Dashboard or CSV
        - Categories
        - Installation or documentation
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not include real orders, account screenshots, or files from `data/`.
          required: true
